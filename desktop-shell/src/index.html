<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LunaAgentOS 控制台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LunaAgentOS</p>
          <h1>第一版桌面控制台原型</h1>
        </div>
        <div class="actions">
          <button id="playBtn" class="primary">播放样例任务</button>
          <button id="resetBtn">重置</button>
        </div>
      </header>

      <main class="layout">
        <aside class="panel fleet-panel">
          <div class="panel-header">
            <h2>Agent 舰队</h2>
            <span class="caption">强大 / 通用 / 免费</span>
          </div>
          <div id="agentList" class="agent-list"></div>
        </aside>

        <section class="panel session-panel">
          <div class="panel-header">
            <div>
              <h2 id="sessionTitle">Hermes</h2>
              <p id="sessionSubtitle" class="caption">通用样板</p>
            </div>
            <div id="stateBadge" class="state-badge state-idle">IDLE</div>
          </div>

          <div id="heroCard" class="hero-card">
            <p class="caption">当前任务</p>
            <h3 id="heroTask">等待任务</h3>
            <p id="heroSummary" class="hero-summary">选择 Agent 或播放样例任务查看统一状态流。</p>
          </div>

          <div class="stream-layout">
            <section class="stream-card">
              <div class="stream-header">
                <h3>消息流</h3>
                <span class="caption">统一消息格式</span>
              </div>
              <div id="messageStream" class="message-stream"></div>
            </section>

            <section class="tool-card">
              <div class="stream-header">
                <h3>工具面板</h3>
                <span class="caption">可见的 TOOLING</span>
              </div>
              <div id="toolPanel" class="tool-panel empty">
                <p>暂无工具调用</p>
              </div>
            </section>
          </div>

          <div class="composer">
            <label for="promptBox">人类输入入口</label>
            <div class="composer-row">
              <textarea id="promptBox" rows="3">帮我总结今天的适配器验证状态，并说明下一步该接哪一个真实 Agent。</textarea>
              <button id="sendBtn" class="primary">模拟发送</button>
            </div>
          </div>
        </section>

        <aside class="panel timeline-panel">
          <div class="panel-header">
            <h2>状态与时间线</h2>
            <span class="caption">呼吸感状态机</span>
          </div>
          <div id="runtimeMeta" class="runtime-meta">
            <div class="meta-chip">
              <span class="caption">桌面壳</span>
              <strong>Tauri 2</strong>
            </div>
            <div class="meta-chip">
              <span class="caption">当前定位</span>
              <strong>轻量桌面控制台</strong>
            </div>
          </div>
          <div id="stateLegend" class="state-legend"></div>
          <div id="timeline" class="timeline"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
