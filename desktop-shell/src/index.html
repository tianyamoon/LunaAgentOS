<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LunaAgentOS 控制台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <p id="appNotice" class="app-notice">工作台准备就绪，等待发送目标接收任务。</p>
        </div>
        <div class="topbar-tools">
          <button id="fontScaleBtn" type="button" class="mini-btn ghost-btn">字体：标准</button>
        </div>
      </header>

      <main class="layout">
        <aside class="panel fleet-panel">
          <div class="panel-header">
            <h2>Agent 舰队</h2>
            <button id="providerManagerBtn" type="button" class="mini-btn ghost-btn">维护</button>
          </div>
          <div id="agentList" class="agent-list"></div>
        </aside>

        <section class="panel workspace-panel">
          <div class="panel-header workspace-header">
            <div>
              <h2>会话工作台</h2>
              <p id="workspaceStatus" class="caption">请选择当前发送目标，然后发送第一条任务。</p>
            </div>
          </div>

          <div class="workspace-body">
            <div id="workspaceEmpty" class="workspace-empty">
              <strong>会话尚未入场</strong>
              <p>先在左侧设定当前发送目标，再通过底部输入框发起会话。</p>
            </div>
            <div id="sessionDeck" class="session-deck"></div>
          </div>

          <div class="composer">
            <div class="composer-row">
              <textarea id="promptBox" rows="4" placeholder="输入发送给当前目标的任务。"></textarea>
              <div class="composer-primary-action">
                <button id="sendBtn" class="primary compact">发送</button>
                <div class="composer-options">
                  <button id="sendModeBtn" type="button" class="mini-btn ghost-btn">Enter 发送</button>
                  <span class="composer-options-divider"></span>
                  <button id="newSessionToggle" type="button" class="session-option-toggle" aria-pressed="false">
                    <span class="toggle-dot"></span>
                    <span>另开会话</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <aside class="panel history-panel">
          <div class="panel-header">
            <h2>会话列表</h2>
            <span class="caption">当前与归档</span>
          </div>
          <div id="historyList" class="history-list"></div>
        </aside>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
