<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LunaAgentOS Console</title>
    <link rel="icon" type="image/png" href="./assets/lunaagentos-logo-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <p class="product-eyebrow" data-i18n="topbar.eyebrow">AI 时代的个人桌面操作系统</p>
          <div class="brand-title-row">
            <h1 class="brand-title">
              <img class="brand-logo" src="./assets/lunaagentos-logo-wordmark.png" alt="LunaAgentOS" />
            </h1>
          </div>
          <p id="appNotice" class="app-notice" aria-live="polite"></p>
        </div>
        <div class="topbar-tools">
          <button id="languageBtn" type="button" class="mini-btn ghost-btn language-switch-btn">语言：中文</button>
          <button id="fontScaleBtn" type="button" class="mini-btn ghost-btn">字体：标准</button>
          <button id="themeBtn" type="button" class="mini-btn ghost-btn">主题：浅色</button>
        </div>
      </header>

      <main class="layout">
        <aside class="panel fleet-panel">
          <div class="panel-header">
            <h2 data-i18n="fleet.title">Agent 舰队</h2>
            <button id="providerManagerBtn" type="button" class="mini-btn ghost-btn">维护</button>
          </div>
          <div id="agentList" class="agent-list"></div>
        </aside>

        <section class="panel workspace-panel">
          <div class="panel-header workspace-header">
            <div>
              <h2 data-i18n="workspace.title">会话工作台</h2>
              <p id="workspaceStatus" class="caption">请选择当前发送目标，然后发送第一条任务。</p>
            </div>
          </div>

          <div class="workspace-body">
            <div id="workspaceEmpty" class="workspace-empty">
              <strong data-i18n="workspace.emptyTitle">会话尚未入场</strong>
              <p data-i18n="workspace.emptyText">先在左侧设定当前发送目标，再通过底部输入框发起会话。</p>
            </div>
            <div id="sessionDeck" class="session-deck"></div>
          </div>

          <div class="composer">
            <div class="composer-row">
              <textarea id="promptBox" rows="4" placeholder="输入发送给当前目标的任务。"></textarea>
              <div class="composer-primary-action">
                <button id="sendBtn" class="primary compact">发送</button>
                <div class="composer-options">
                  <button id="sendModeBtn" type="button" class="mini-btn ghost-btn">Enter 发送</button>
                  <span class="composer-options-divider"></span>
                  <button id="newSessionToggle" type="button" class="session-option-toggle" aria-pressed="false">
                    <span class="toggle-dot"></span>
                    <span data-i18n="composer.newSession">另开会话</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <aside class="panel history-panel">
          <div class="panel-header">
            <h2 data-i18n="history.title">会话列表</h2>
            <span class="caption" data-i18n="history.subtitle">当前与归档</span>
          </div>
          <div id="historyList" class="history-list"></div>
        </aside>
      </main>
    </div>
    <div id="confirmDialog" class="confirm-dialog-backdrop" hidden></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
