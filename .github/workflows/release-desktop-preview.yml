name: Release Desktop Preview

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to publish or refresh, for example v0.1.0-preview
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and Publish Windows Preview
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop-shell

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release_meta
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}") {
            "${{ github.ref_name }}"
          } elseif ("${{ github.event.inputs.tag_name }}") {
            "${{ github.event.inputs.tag_name }}"
          } else {
            "manual-${{ github.run_number }}"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-shell/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop-shell/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:all

      - name: Run undefined symbol lint
        run: npm run lint:undef

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build lightweight executable
        run: npm run tauri -- build --no-bundle

      - name: Package release asset
        id: package
        run: |
          $tag = "${{ steps.release_meta.outputs.tag }}"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $assetBase = "LunaAgentOS-$tag-windows-x64-no-bundle"
          $assetDir = Join-Path $env:RUNNER_TEMP $assetBase
          New-Item -ItemType Directory -Path $assetDir -Force | Out-Null
          Copy-Item "src-tauri/target/release/desktop-shell.exe" (Join-Path $assetDir "LunaAgentOS.exe")
          Copy-Item "../../LICENSE" (Join-Path $assetDir "LICENSE")
          if (Test-Path "../../docs/release-notes-0.1-preview.md") {
            Copy-Item "../../docs/release-notes-0.1-preview.md" (Join-Path $assetDir "RELEASE_NOTES.md")
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "$assetBase.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $assetDir "*") -DestinationPath $zipPath
          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $hashPath = Join-Path $env:RUNNER_TEMP "$assetBase.sha256"
          Set-Content -Path $hashPath -Value "$hash  $(Split-Path $zipPath -Leaf)"
          "asset_base=$assetBase" >> $env:GITHUB_OUTPUT
          "asset_zip=$zipPath" >> $env:GITHUB_OUTPUT
          "asset_sha=$hashPath" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Prepare GitHub release notes
        id: release_notes
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ steps.release_meta.outputs.tag }}"
          $notesPath = "../../docs/release-notes-0.1-preview.md"
          $notes = Get-Content $notesPath -Raw
          $zhReleaseNotesUrl = "https://github.com/$repo/blob/$tag/docs/release-notes-0.1-preview.zh-CN.md"
          $enGettingStartedUrl = "https://github.com/$repo/blob/$tag/docs/getting-started.md"
          $notes = $notes.Replace("(./release-notes-0.1-preview.zh-CN.md)", "($zhReleaseNotesUrl)")
          $notes = $notes.Replace("(./getting-started.md)", "($enGettingStartedUrl)")
          $outPath = Join-Path $env:RUNNER_TEMP "release-notes-$tag.md"
          Set-Content -Path $outPath -Value $notes
          "path=$outPath" >> $env:GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset_base }}
          path: |
            ${{ steps.package.outputs.asset_zip }}
            ${{ steps.package.outputs.asset_sha }}

      - name: Publish GitHub release
        if: github.ref_type == 'tag' || github.event.inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: LunaAgentOS ${{ steps.release_meta.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.path }}
          prerelease: true
          files: |
            ${{ steps.package.outputs.asset_zip }}
            ${{ steps.package.outputs.asset_sha }}
